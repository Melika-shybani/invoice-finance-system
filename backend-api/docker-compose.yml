version: '3.8'

services:
  backend:
    build: .
    container_name: invoice_finance_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017/invoice_finance_db
      - JWT_SECRET=super_secret_jwt_key_invoice_finance_system_2026
      - CLIENT_URL=http://localhost:5173
      - NODE_ENV=development
      - AUTO_SEED=true
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: invoice_finance_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
