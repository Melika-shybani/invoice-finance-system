version: '3.8'

services:
  backend:
    build: .
    container_name: invoice_finance_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017/invoice_finance_db
      - JWT_SECRET=super_secret_jwt_key_invoice_finance_system_2026
      - NODE_ENV=production
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    container_name: invoice_finance_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
